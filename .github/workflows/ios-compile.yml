name: Compile iOS demo

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile for iPhone Simulator
        run: |
          xcodebuild \
            -project FocusRepDemo.xcodeproj \
            -scheme FocusRepDemo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Compile for iPhone device without signing
        run: |
          xcodebuild \
            -project FocusRepDemo.xcodeproj \
            -scheme FocusRepDemo \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned build outputs
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Debug-iphonesimulator/FocusRepDemo.app \
            FocusRepDemo-simulator.zip
          mkdir Payload
          ditto \
            DerivedData/Build/Products/Debug-iphoneos/FocusRepDemo.app \
            Payload/FocusRepDemo.app
          test -d Payload/FocusRepDemo.app/PlugIns/FocusRepWidget.appex
          ditto -c -k --sequesterRsrc --keepParent Payload FocusRepDemo-unsigned.ipa
          unzip -l FocusRepDemo-unsigned.ipa | grep -F 'Payload/FocusRepDemo.app/PlugIns/FocusRepWidget.appex/'
      - uses: actions/upload-artifact@v6
        with:
          name: FocusRepDemo-unsigned-builds
          path: |
            FocusRepDemo-simulator.zip
            FocusRepDemo-unsigned.ipa
          if-no-files-found: error
